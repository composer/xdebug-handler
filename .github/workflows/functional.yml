name: Functional Tests

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Functional Tests

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      matrix:
        php-version:
          - "7.2"
          - "8.4"
        os: [ubuntu-latest]
        experimental: [false]
        include:
          - php-version: "7.2"
            os: windows-latest
            experimental: false
          - php-version: "8.4"
            os: windows-latest
            experimental: false
          - php-version: "8.5"
            os: ubuntu-latest
            experimental: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: xdebug

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      - name: Run tests
        if: ${{ !matrix.experimental }}
        # Include --fail-on-skipped when min PHP is > 7.2.5
        run: vendor/bin/phpunit --group functional

      # Show deprecations on latest PHP
      - name: Run tests (experimental)
        if: ${{ matrix.experimental }}
        run: vendor/bin/phpunit --group functional --fail-on-skipped --display-deprecations
