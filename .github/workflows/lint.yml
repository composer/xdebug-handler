name: PHP Lint

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version:
          - "7.2"
          - "nightly"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          find src tests -type f -name '*.php' -print0 |
          xargs -0 -n 1 -P $(nproc) bash -c '
            file="$1"
            if ! output=$(php -derror_reporting=-1 -l "$file" 2>&1); then
              read -r line <<< "$output"
              echo "::error file=$file::$line"
              exit 1
            fi
            echo "$output"
          ' _
